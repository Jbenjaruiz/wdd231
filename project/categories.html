<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <div id="header-placeholder"></div>

    <main class="main-categories">

            <div class="container">
                <ul id="filters-list">
                    <li class="filter-item active" data-query="latest" data-type="order">The Latest</li>
                    <li class="filter-item" data-query="vintage motorcycle" data-type="search">Vintage</li>
                    <li class="filter-item" data-query="off-road motorcycle" data-type="search">Off-road</li>
                    <li class="filter-item" data-query="racing motorcycle" data-type="search">Track</li>
                    <li class="filter-item" data-query="cruiser motorcycle" data-type="search">Cruiser</li>
                    <li class="filter-item" data-query="cafe racer" data-type="search">Cafe Racer</li>
                </ul>
            </div>
        </section>

        <section class="gallery-section container">
            <div id="gallery-grid">
                </div>
            <p id="gallery-message">Loading the latest motorcycle pictures...</p>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="scripts/components.js"></script> <script src="scripts/categories.js"></script>   </body>
